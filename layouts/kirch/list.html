{{/*
  Section-Layout fuer "Kirch": nur Titel + Inhalt (unsere eigenen
  section-Teaser). Gleiche Begruendung wie layouts/wirtschaft/list.html -
  Blowfish's automatische, datierte Unterseiten-Auflistung wird hier
  nicht gebraucht.
*/}}
{{ define "main" }}
  <header>
    <h1 class="sr-only">
      {{ .Title | emojify }}
    </h1>
  </header>
  <section class="mt-0 prose flex max-w-full flex-col dark:prose-invert lg:flex-row mb-10">
    <div class="min-w-0 min-h-0 max-w-prose w-full">
      {{ .Content }}
    </div>
  </section>
{{ end }}
